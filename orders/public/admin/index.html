<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Orders admin | Aidem Media</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="notice" id="test-notice" hidden><div class="wrap wide"><strong>Test mode is on.</strong> Parents see a Test payment button. Turn off TEST_PAYMENTS before the first real concert.</div></div>
<header class="site"><div class="wrap wide">
  <img src="/logo.png" alt="Aidem Media" width="152" height="40">
  <nav class="tabs" id="tabs" hidden aria-label="Admin">
    <button type="button" data-tab="concerts">Concerts</button>
    <button type="button" data-tab="find">Find an order</button>
    <button type="button" data-tab="discounts">Discount codes</button>
    <button type="button" data-tab="setup">Setup</button>
    <button type="button" id="logout">Sign out</button>
  </nav>
</div></header>
<div class="wrap wide">
  <main id="app" class="step"><p class="muted">Loading…</p></main>
</div>
<dialog id="dlg"><div class="card" id="dlg-body"></div></dialog>
<script src="/admin.js" defer></script>
</body>
</html>
